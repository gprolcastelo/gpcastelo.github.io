title: "Guillermo Prol-Castelo"
description: "Personal academic site — research, publications, and outreach"
url: "https://gprolcastelo.github.io"
baseurl: ""

markdown: kramdown
theme: null
plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: "/blog/:title/"
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
  - node_modules
